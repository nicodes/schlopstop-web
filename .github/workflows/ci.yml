name: Build & Test
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend build and environment tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned SDKs
        uses: nicodes/tools/setup@a88380ae0f434b1dd318293db3d0828a6facc66b
        env:
          GH_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        timeout-minutes: 5
      - name: Report exact SDK versions
        run: |
          mise exec -- node --version
          mise exec -- pnpm --version
      - name: Install locked dependencies
        run: mise run setup
        timeout-minutes: 5
      - name: Test actual framework environment loading
        run: mise run test
        timeout-minutes: 2
      - name: Build frontend
        run: mise run build
        timeout-minutes: 5
      - name: Preserve built frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Check out integration verification tools
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: 6a651cc9c59c0cec127f987bcbac0074352e88b5
          path: .artifacts/dependency-tools
          persist-credentials: false
      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: /usr/bin/python3 -I -B .artifacts/dependency-tools/helpers/integration-identity.py
      - name: Upload integration identity
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
